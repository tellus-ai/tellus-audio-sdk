name: Install Command Preflight

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  platform-packages:
    name: Platform packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify installers and platform packages
        run: npm run verify:pre-commit
