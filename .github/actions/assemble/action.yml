name: Assemble platform SDK packages
description: Build runtime kits from an explicitly pinned engine revision
inputs:
  engine-ref:
    description: Full 40-character engine commit SHA
    required: true
  token:
    description: Read-only token with access to the private engine repository
    required: true
runs:
  using: composite
  steps:
    - name: Validate the engine revision
      shell: bash
      env:
        ENGINE_REF: ${{ inputs.engine-ref }}
      run: node -e 'if (!/^[a-f0-9]{40}$/.test(process.env.ENGINE_REF)) throw new Error("TELLUS_AUDIO_ENGINE_REF must be a full commit SHA")'
    - name: Checkout the pinned engine
      uses: actions/checkout@v4
      with:
        repository: tellus-ai/Tellus-audio-engine
        ref: ${{ inputs.engine-ref }}
        token: ${{ inputs.token }}
        path: .engine-source
        persist-credentials: false
    - name: Build engine runtime kits
      shell: bash
      working-directory: .engine-source
      run: |
        npm ci --ignore-scripts
        npm run build:runtime
    - name: Assemble SDK packages
      shell: bash
      env:
        TELLUS_AUDIO_ENGINE_DIST: ${{ github.workspace }}/.engine-source/dist
      run: npm run build
    - name: Configure later verification commands
      shell: bash
      run: echo "TELLUS_AUDIO_ENGINE_DIST=$GITHUB_WORKSPACE/.engine-source/dist" >> "$GITHUB_ENV"
