name: tellus_audio_sdk
description: Tellus Audio SDK for Flutter. Microphone capture, denoise and Opus encoding run in the Tellus native engine.
version: 0.3.15
publish_to: none
repository: https://github.com/tellus-ai/tellus-audio-sdk

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TellusAudioSdkPlugin
      android:
        package: ai.tellus.audio.flutter
        pluginClass: TellusAudioSdkPlugin
